[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "sendcheck"
version = "0.3.0"
description = "Pre-send compliance checks for email and SMS — Spam Act (AU), CAN-SPAM (US), CASL (CA), GDPR (EU)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Truckling"}
]
keywords = ["mcp", "email", "compliance", "spam-act", "australia", "can-spam", "casl", "gdpr", "marketing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Communications :: Email",
    "Topic :: Office/Business",
]
dependencies = [
    "mcp>=2.0.0",
    "uvicorn>=0.30.0",
]

[project.urls]
Homepage = "https://github.com/Truckling/sendcheck"
Repository = "https://github.com/Truckling/sendcheck"
Issues = "https://github.com/Truckling/sendcheck/issues"

[project.scripts]
sendcheck = "sendcheck.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sendcheck*"]
