[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "sendcheck"
version = "0.1.0"
description = "Pre-send compliance checks for Australian email and SMS (Spam Act 2003)"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
]

[project.scripts]
sendcheck = "sendcheck.server:main"

[tool.setuptools.packages.find]
where = ["."]
